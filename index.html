<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOOT Lab</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f5f2; --surface: #fcfcfb; --line: #e4e2dc; --grid: #ecebe6;
  --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #7b7a75;
  --up: #1a7f37; --down: #c2412f;
  --ai: #2a78d6; --noai: #eb6834;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --line: #2f2f2c; --grid: #262624;
    --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #8f8e86;
    --up: #4ac26b; --down: #ff7b6b; --ai: #3987e5; --noai: #d95926;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 24px; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
.cards { display: grid; gap: 12px; margin-top: 20px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px;
  text-decoration: none; color: inherit; display: block; }
a.card:hover { border-color: var(--ink-3); }
.card h2 { font-size: 15px; font-weight: 500; color: var(--ink-2); margin: 0; display: flex; justify-content: space-between; gap: 8px; }
.card h2 .day { font-size: 13px; color: var(--ink-3); white-space: nowrap; }
.headline { font-size: 21px; font-weight: 650; margin: 6px 0 4px; letter-spacing: -0.01em; }
.line { font-size: 14px; color: var(--ink-2); }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--ink-3); }
.key { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: 0; }
.spark { margin-top: 10px; }
.spark svg { display: block; width: 100%; height: 44px; }
.back { color: var(--ink-2); text-decoration: none; font-size: 14px; }
.rank { display: grid; }
.rk { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 9px 0; border-top: 1px solid var(--grid); align-items: center; }
.rk:first-child { border-top: 0; padding-top: 0; }
.rk .n { font-weight: 500; }
.rk .t { color: var(--ink-3); font-size: 12.5px; }
.rk .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.tag { font-size: 11px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; margin-left: 6px; font-weight: 400; }
.chart { margin-top: 14px; }
.chart > svg { display: block; width: 100%; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-2); margin-top: 6px; }
details { margin-top: 14px; }
summary { cursor: pointer; color: var(--ink-2); font-size: 14px; }
.item { padding: 8px 0; border-top: 1px solid var(--grid); font-size: 14px; }
.item:first-child { border-top: 0; padding-top: 0; }
.item .why { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.muted { color: var(--ink-3); }
.foot { margin-top: 28px; color: var(--ink-3); font-size: 12.5px; }
</style>
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>
<script>
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = (x, d=0) => (x < 0 ? "−$" : "$") + Math.abs(x).toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d});
const signed = x => x == null ? "—" : (x >= 0.5 ? "+" : x <= -0.5 ? "−" : "") + "$" + Math.abs(x).toLocaleString("en-US", {maximumFractionDigits: 0});
const cls = x => x == null ? "flat" : x > 0.5 ? "up" : x < -0.5 ? "down" : "flat";
const pct = (x, d=1) => (x >= 0 ? "+" : "−") + Math.abs(x).toFixed(d) + "%";
const dayName = iso => new Date(iso + "T12:00:00Z").toLocaleDateString("en-GB", {day: "numeric", month: "short", timeZone: "UTC"});
const SERIES = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"];
const isAI = l => l.kind === "agent" || l.kind === "manager";
const cache = {};
const get = name => cache[name] ||= fetch(name + ".json", {cache: "no-store"}).then(r => r.json());

async function route() {
  const id = location.hash.slice(1);
  window.scrollTo(0, 0);
  if (id) return detail(id);
  const runs = await get("runs");
  $("#app").innerHTML = `<h1>LOOT Lab</h1><div class="sub">Can AI make money trading, and can it see events coming? Paper money only.</div>
    <div class="cards" id="cards"></div>
    <div class="foot">Each trading lane started with $10,000; results are after broker fees and the AI's own thinking costs. Tap a card for detail.</div>`;
  const loaded = (await Promise.all(runs.map(r => get(r.run).then(d => [r, d]).catch(() => [r, null])))).filter(([, d]) => d);
  const live = loaded.filter(([, d]) => d.kind !== "forecast" && !d.closed);
  const fc = loaded.filter(([, d]) => d.kind === "forecast");
  const old = loaded.filter(([, d]) => d.kind !== "forecast" && d.closed);
  for (const [r, d] of live) { $("#cards").insertAdjacentHTML("beforeend", tradingCard(r, d)); spark(d, r.run); }
  if (fc.length) $("#cards").insertAdjacentHTML("beforeend", forecastCard(fc));
  if (old.length) $(".foot").insertAdjacentHTML("beforeend", "<br>Earlier: " + old.map(([r]) => `<a class="back" href="#${r.run}">${esc(r.title)}</a>`).join(" · "));
}

const READER_ORDER = ["f3", "f2", "f1"];
const readerName = r => ({f1: "Jev, reading headlines", f2: "Sonnet, reading headlines", f3: "Sonnet, deep research"})[r] || r;
const readerScore = sc => sc.brier_research ?? sc.brier_sonnet ?? sc.brier_jev_news;

function tradingCard(r, d) {
  const s = d.summary, total = d.days.length;
  const status = d.closed ? "stopped" : s.days_done >= total ? "finished" : `day ${s.days_done} of ${total}`;
  let headline = "Running";
  if (s.pairs_total) headline = `AI ahead in ${s.pairs_ai_ahead} of ${s.pairs_total} strategies`;
  else if (s.ai_avg != null && s.no_ai_avg != null) {
    const gap = s.ai_avg - s.no_ai_avg;
    headline = Math.abs(gap) < 1 ? "AI level with no AI" : gap > 0 ? `AI ahead by ${money(gap)}` : `AI behind by ${money(-gap)}`;
  }
  return `<a class="card" href="#${r.run}"><h2>${esc(r.title)}<span class="day">${status}</span></h2>
    <div class="headline">${headline}</div>
    <div class="line"><span class="key" style="background:var(--ai)"></span>AI <b class="${cls(s.ai_avg)}">${signed(s.ai_avg)}</b>
      &nbsp;·&nbsp; <span class="key" style="background:var(--noai)"></span>No AI <b class="${cls(s.no_ai_avg)}">${signed(s.no_ai_avg)}</b>
      &nbsp;·&nbsp; ${esc(s.market_label)} <span class="${cls(s.market_move_pct * 100)}">${pct(s.market_move_pct)}</span>
      <span class="muted">(average per lane)</span></div>
    <div class="spark" id="spark-${r.run}"></div></a>`;
}

function verdict(d) {
  const sc = d.score || {}, n = sc.settled || 0;
  if (!n) return {n, text: "waiting for questions to settle", cls: "flat"};
  const ahead = readerScore(sc) < sc.brier_market;
  return {n, text: ahead ? "more accurate than the market" : "less accurate than the market", cls: ahead ? "up" : "down"};
}

function forecastCard(fc) {
  const by = Object.fromEntries(fc.map(([r, d]) => [r.run, d]));
  const settled = Math.max(0, ...fc.map(([, d]) => d.score?.settled || 0));
  const best = READER_ORDER.map(k => by[k]).find(d => d && (d.score?.settled || 0) > 0);
  const headline = !best ? "Waiting for questions to settle" : verdict(best).cls === "up" ? "AI beating the market so far" : "Market beating the AI so far";
  const lines = READER_ORDER.filter(k => by[k]).map(k => { const v = verdict(by[k]);
    return `<div class="line">${readerName(k)} · <span class="${v.cls}">${v.n ? v.text : by[k].questions + " judged, none settled"}</span></div>`; }).join("");
  return `<a class="card" href="#forecast"><h2>Forecasting: can AI predict events better than betting markets?<span class="day">${settled} settled</span></h2>
    <div class="headline">${headline}</div>${lines}</a>`;
}

function avgSeries(lanes, cap) {
  const n = Math.max(0, ...lanes.map(l => l.marks.length));
  return Array.from({length: n}, (_, i) => {
    const v = lanes.filter(l => l.marks[i]).map(l => l.marks[i][1] - cap);
    return v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0;
  });
}

function spark(d, run) {
  const a = avgSeries(d.lanes.filter(isAI), d.capital), b = avgSeries(d.lanes.filter(l => !isAI(l)), d.capital), n = d.days.length;
  if (Math.max(a.length, b.length) < 2) return;
  const all = [0, ...a, ...b], lo = Math.min(...all), span = Math.max(20, Math.max(...all) - lo);
  const W = 600, H = 44, x = i => i / (n - 1) * W, y = v => 4 + (1 - (v - lo) / span) * (H - 8);
  const path = s => s.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  $("#spark-" + run).innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--grid)" vector-effect="non-scaling-stroke"/>
    <path d="${path(b)}" fill="none" stroke="var(--noai)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <path d="${path(a)}" fill="none" stroke="var(--ai)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

async function detail(id) {
  const runs = await get("runs");
  if (id === "forecast") return forecastOverview(runs);
  const r = runs.find(x => x.run === id) || {run: id, title: id};
  const d = await get(id).catch(() => null);
  if (!d) { $("#app").innerHTML = `<a class="back" href="#">← All experiments</a><p class="muted">Not found.</p>`; return; }
  return d.kind === "forecast" ? forecastDetail(r, d) : tradingDetail(r, d);
}

function tradingDetail(r, d) {
  const cap = d.capital, colour = {}; d.lanes.forEach((l, i) => { colour[l.id] = SERIES[i % 8]; });
  const ranked = [...d.lanes].sort((a, b) => b.value - a.value), s = d.summary;
  let h = `<a class="back" href="#">← All experiments</a><h1 style="margin-top:10px">${esc(r.title)}</h1>
    <div class="sub">${esc(s.market_label)} ${pct(s.market_move_pct)} since the start · AI thinking so far ${money(d.ai_cost, 2)}</div>
    <div class="card" style="margin-top:16px"><div class="rank">`;
  for (const l of ranked) {
    const ch = l.value - cap;
    h += `<div class="rk"><div><span class="key" style="background:var(${colour[l.id]})"></span><span class="n">${esc(l.label)}</span><span class="tag">${isAI(l) ? "AI" : "no AI"}</span>
      <div class="t">${esc(l.tests)}</div></div><div class="v ${cls(ch)}">${signed(ch)}</div></div>`;
  }
  h += `</div><div class="chart" id="chart"></div></div>`;
  const trades = d.trades.slice().reverse().map(t => {
    const l = d.lanes.find(x => x.id === t.lane), name = t.name ? ` (${esc(t.name)})` : "";
    const res = t.result != null ? ` · <span class="${cls(t.result)}">${t.result >= 0 ? "made" : "lost"} ${money(Math.abs(t.result))}</span>` : "";
    const amt = d.market === "crypto" && t.price ? money(t.qty * t.price) + " of" : t.qty;
    return `<div class="item"><span class="muted">${dayName(t.day)} · ${esc(l?.label || t.lane)}</span><br>${t.side === "BUY" ? "Bought" : "Sold"} ${amt} ${esc(t.symbol)}${name}${t.price ? " at " + money(t.price, 2) : ""}${res}
      ${t.why && !["harness","baseline"].includes(t.origin) ? `<div class="why">${esc(t.why)}</div>` : ""}</div>`;
  }).join("");
  h += `<details><summary>Every trade (${d.trades.length})</summary><div class="card" style="margin-top:8px">${trades || `<div class="muted">No trades yet.</div>`}</div></details>`;
  const holds = d.lanes.map(l => `<div class="item"><b>${esc(l.label)}</b> <span class="muted">· cash ${money(l.cash)}</span><br>` +
    (l.holdings.map(x => { const g = ((x.price ?? x.bought_at) - x.bought_at) * x.qty;
      return `${esc(x.symbol)}${x.name ? " (" + esc(x.name) + ")" : ""} <span class="${cls(g)}">${signed(g)}</span> <span class="muted">· sells ${dayName(x.sell_by)}</span>`; }).join("<br>")
     || `<span class="muted">nothing held</span>`) + `</div>`).join("");
  h += `<details><summary>What each lane holds now</summary><div class="card" style="margin-top:8px">${holds}</div></details>`;
  $("#app").innerHTML = h;
  chart(d, colour);
}

async function forecastOverview(runs) {
  const fc = (await Promise.all(runs.filter(r => r.run.startsWith("f")).map(r => get(r.run).then(d => [r, d]).catch(() => null)))).filter(Boolean);
  const by = Object.fromEntries(fc.map(([r, d]) => [r.run, d]));
  const rows = READER_ORDER.filter(k => by[k]).map(k => { const d = by[k], v = verdict(d);
    return `<a class="rk" href="#${k}" style="color:inherit;text-decoration:none"><div><span class="n">${readerName(k)}</span>
      <div class="t">${d.questions} questions judged · ${v.n} settled · ${money(d.cost, 2)} spent</div></div>
      <div class="v ${v.cls}" style="font-weight:500;font-size:14px">${v.n ? v.text : "waiting"}</div></a>`; }).join("");
  $("#app").innerHTML = `<a class="back" href="#">← All experiments</a><h1 style="margin-top:10px">Forecasting</h1>
    <div class="sub">Three AI readers judge the same prediction-market questions without seeing the betting price. When each question settles, we check whose probability was closer: the AI's or the market's.</div>
    <div class="card" style="margin-top:16px"><div class="rank">${rows}</div></div>`;
}

function forecastDetail(r, d) {
  const sc = d.score || {}, n = sc.settled || 0, need = {f1: 300, f2: 100, f3: 50}[r.run] || 50;
  const mine = sc.brier_research ?? sc.brier_sonnet ?? sc.brier_jev_news;
  const score = n ? `<div class="item muted">Average miss on ${n} settled questions — lower is better. A verdict needs ${need}.</div>
      <div class="item">Market price <b style="float:right">${sc.brier_market}</b></div>
      <div class="item">${esc(d.reader)} <b style="float:right">${mine}</b></div>
      ${sc.brier_jev_news != null && mine !== sc.brier_jev_news ? `<div class="item">Jev, same questions <b style="float:right">${sc.brier_jev_news}</b></div>` : ""}`
    : `<div class="item muted">No question has settled yet. The first ones close within days; a verdict needs ${need} settled.</div>`;
  $("#app").innerHTML = `<a class="back" href="#forecast">← Forecasting</a><h1 style="margin-top:10px">${esc(r.title)}</h1>
    <div class="sub">${esc(d.reader)} judges prediction-market questions without seeing the price. ${d.questions} questions so far · ${money(d.cost, 2)} spent.</div>
    <div class="card" style="margin-top:16px">${score}</div>
    <details><summary>Where it disagrees most with the market</summary><div class="card" style="margin-top:8px">` +
    d.disagreements.map(x => `<div class="item">${esc(x.question)} <span class="muted">— ${esc(x.option)}</span><br>
      Market <b>${Math.round(x.market * 100)}%</b> · AI <b>${Math.round(x.reader * 100)}%</b> <span class="muted">· settles ${dayName(x.closes)}</span></div>`).join("") + `</div></details>`;
}

function chart(d, colour) {
  const box = $("#chart"), W = Math.max(300, box.clientWidth), H = 190, m = {l: 50, r: 10, t: 8, b: 22};
  const n = d.days.length, cap = d.capital;
  const ser = d.lanes.map(l => ({id: l.id, pts: l.marks.map(([dd, v]) => [d.days.indexOf(dd), v - cap])}));
  if (Math.max(0, ...ser.map(s => s.pts.length)) < 2) { box.innerHTML = `<div class="muted" style="font-size:13px">The chart appears after day 2.</div>`; return; }
  const all = [0, ...ser.flatMap(s => s.pts.map(p => p[1]))];
  const raw = Math.max(40, Math.max(...all) - Math.min(...all)) / 4, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(k => k * mag).find(k => k >= raw);
  const lo = Math.floor(Math.min(...all) / step) * step, hi = Math.max(lo + step, Math.ceil(Math.max(...all) / step) * step);
  const x = i => m.l + i / (n - 1) * (W - m.l - m.r), y = v => m.t + (1 - (v - lo) / (hi - lo)) * (H - m.t - m.b);
  let s = `<svg viewBox="0 0 ${W} ${H}">`;
  for (let v = lo; v <= hi + 1e-9; v += step) s += `<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${m.l-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${signed(v)}</text>`;
  s += `<text x="${m.l}" y="${H-6}" font-size="11" fill="var(--ink-3)">${dayName(d.days[0])}</text><text x="${W-m.r}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--ink-3)">${dayName(d.days[n-1])}</text>`;
  ser.forEach(se => { if (se.pts.length) s += `<path d="${se.pts.map((p, i) => `${i ? "L" : "M"}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join("")}" fill="none" stroke="var(${colour[se.id]})" stroke-width="2" stroke-linejoin="round"/>`; });
  box.innerHTML = s + `</svg>`;
}
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
